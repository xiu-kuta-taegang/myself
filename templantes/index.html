<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>双人打卡</title>
<style>
  :root {
    --primary: #6366f1;
    --bg: #f3f4f6;
    --card-bg: #ffffff;
    --text: #1f2937;
    --text-light: #6b7280;
  }
  body { 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    background: var(--bg); 
    margin: 0; 
    padding: 12px; 
    color: var(--text);
  }
  .header { text-align: center; margin-bottom: 16px; }
  .header h1 { font-size: 20px; margin: 0; color: var(--primary); }
  
  .container { display: flex; flex-direction: column; gap: 16px; }
  @media (min-width: 768px) {
    .container { flex-direction: row; justify-content: center; max-width: 900px; margin: 0 auto; }
    .card { flex: 1; }
  }

  .card { 
    background: var(--card-bg); 
    border-radius: 16px; 
    padding: 16px; 
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); 
  }
  
  /* 昵称的样式 */
  .card h2 { font-size: 18px; margin: 0 0 12px 0; display: flex; justify-content: space-between; align-items: center; }
  .name-input {
    font-size: 18px; font-weight: bold; border: 1px dashed #d1d5db; 
    background: transparent; padding: 4px 8px; border-radius: 6px; 
    width: 120px; outline: none; color: var(--text); transition: 0.2s;
  }
  .name-input:focus, .name-input:hover { border-color: var(--primary); background: #f9fafb; }
  .edit-hint { font-size: 12px; color: #9ca3af; font-weight: normal; }

  .stats { display: flex; gap: 12px; margin-bottom: 12px; }
  .stat-box { flex: 1; background: #f9fafb; padding: 10px; border-radius: 10px; text-align: center; }
  .stat-box .label { font-size: 12px; color: var(--text-light); }
  .stat-box .value { font-size: 20px; font-weight: bold; color: var(--primary); margin-top: 4px; }
  
  .foods-list { font-size: 13px; color: var(--text-light); margin-bottom: 12px; max-height: 100px; overflow-y: auto; }
  .food-item { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px dashed #e5e7eb; }
  
  .input-group { display: flex; gap: 8px; margin-bottom: 8px; }
  input[type="text"], input[type="number"] { 
    flex: 1; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; outline: none; 
  }
  input[type="text"]:focus, input[type="number"]:focus { border-color: var(--primary); }
  button { 
    background: var(--primary); color: white; border: none; padding: 10px 16px; border-radius: 8px; 
    font-size: 14px; font-weight: bold; cursor: pointer; transition: opacity 0.2s;
  }
  button:active { opacity: 0.8; }
  .btn-secondary { background: #10b981; }
  
  .search-results { margin-bottom: 8px; }
  .result-item { 
    background: #f3f4f6; padding: 10px; border-radius: 8px; margin-bottom: 6px; 
    font-size: 13px; cursor: pointer; display: flex; justify-content: space-between;
  }
  .result-item:active { background: #e5e7eb; }
  
  hr { border: 0; border-top: 1px solid #e5e7eb; margin: 16px 0; }
  .reset-btn { background: #ef4444; width: 100%; margin-top: 20px; padding: 12px; border-radius: 8px; }
</style>
</head>
<body>

<div class="header">
  <h1>🍚 双人打卡看板</h1>
</div>

<div class="container">
  <!-- 我 -->
  <div class="card" id="card-a">
    <h2>
      <input class="name-input" id="a-name" value="我" onchange="updateName('a')" title="点击修改昵称">
      <span class="edit-hint">点击名字可改</span>
    </h2>
    <div class="stats">
      <div class="stat-box">
        <div class="label">今日热量</div>
        <div class="value"><span id="a-cal">0</span> <span style="font-size:12px;font-weight:normal">kcal</span></div>
      </div>
      <div class="stat-box">
        <div class="label">学习时长</div>
        <div class="value"><span id="a-study">0</span> <span style="font-size:12px;font-weight:normal">分钟</span></div>
      </div>
    </div>
    
    <div class="foods-list" id="a-foods"></div>
    
    <div class="input-group">
      <input type="text" id="a-search" placeholder="输入英文食物名，如 rice">
      <button onclick="searchFood('a')">搜索</button>
    </div>
    <div class="search-results" id="a-results"></div>
    
    <div class="input-group">
      <input type="number" id="a-grams" placeholder="克重，如 150">
      <button class="btn-secondary" onclick="addFood('a')">添加食物</button>
    </div>
    
    <hr>
    <div class="input-group">
      <input type="number" id="a-minutes" placeholder="学习分钟数">
      <button onclick="addStudy('a')">记学习</button>
    </div>
  </div>

  <!-- 对方 -->
  <div class="card" id="card-b">
    <h2>
      <input class="name-input" id="b-name" value="对方" onchange="updateName('b')" title="点击修改昵称">
      <span class="edit-hint">点击名字可改</span>
    </h2>
    <div class="stats">
      <div class="stat-box">
        <div class="label">今日热量</div>
        <div class="value"><span id="b-cal">0</span> <span style="font-size:12px;font-weight:normal">kcal</span></div>
      </div>
      <div class="stat-box">
        <div class="label">学习时长</div>
        <div class="value"><span id="b-study">0</span> <span style="font-size:12px;font-weight:normal">分钟</span></div>
      </div>
    </div>
    
    <div class="foods-list" id="b-foods"></div>
    
    <div class="input-group">
      <input type="text" id="b-search" placeholder="输入英文食物名，如 rice">
      <button onclick="searchFood('b')">搜索</button>
    </div>
    <div class="search-results" id="b-results"></div>
    
    <div class="input-group">
      <input type="number" id="b-grams" placeholder="克重，如 150">
      <button class="btn-secondary" onclick="addFood('b')">添加食物</button>
    </div>
    
    <hr>
    <div class="input-group">
      <input type="number" id="b-minutes" placeholder="学习分钟数">
      <button onclick="addStudy('b')">记学习</button>
    </div>
  </div>
</div>

<button class="reset-btn" onclick="resetData()">清空今日数据（两人同步清零）</button>

<script>
let selected = { a: null, b: null };

// 刷新数据
async function refresh() {
  try {
    const r = await fetch('/api/data');
    const d = await r.json();
    for (const [ui, key] of [['a','user_a'],['b','user_b']]) {
      // 更新昵称
      document.getElementById(ui+'-name').value = d[key].name;
      
      document.getElementById(ui+'-cal').textContent = d[key].calories;
      document.getElementById(ui+'-study').textContent = d[key].study_minutes;
      const foods = d[key].foods.slice(-5).reverse().map(f =>
        `<div class="food-item"><span>${f.name}</span> <span>${f.grams}g · ${f.kcal} kcal</span></div>`
      ).join('');
      document.getElementById(ui+'-foods').innerHTML = foods || '<div style="text-align:center;padding:10px;">暂无记录</div>';
    }
  } catch(e) { console.error(e); }
}

// 修改昵称
async function updateName(ui) {
  const newName = document.getElementById(ui+'-name').value.trim();
  if (!newName) {
    alert('名字不能为空哦');
    refresh(); // 还原
    return;
  }
  const user = ui === 'a' ? 'user_a' : 'user_b';
  await fetch('/api/update_name', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ user, name: newName })
  });
  refresh();
}

// 搜索食物
async function searchFood(ui) {
  const q = document.getElementById(ui+'-search').value.trim();
  if (!q) return;
  const box = document.getElementById(ui+'-results');
  box.innerHTML = '<div class="result-item">搜索中...</div>';
  
  const r = await fetch('/api/search?q=' + encodeURIComponent(q));
  const list = await r.json();
  
  if (!Array.isArray(list) || list.length === 0) {
    box.innerHTML = '<div class="result-item" style="color:#ef4444">没搜到，换个英文名试试</div>';
    return;
  }
  
  box.innerHTML = '';
  list.forEach(item => {
    const div = document.createElement('div');
    div.className = 'result-item';
    div.innerHTML = `<span>${item.name}</span> <span style="color:var(--primary)">${item.kcal_per_100g} kcal/100g</span>`;
    div.onclick = () => {
      selected[ui] = item;
      box.innerHTML = `<div class="result-item" style="background:#e0e7ff;color:var(--primary)">已选：${item.name}</div>`;
    };
    box.appendChild(div);
  });
}

// 添加食物
async function addFood(ui) {
  if (!selected[ui]) { alert('请先搜索并点选一个食物！'); return; }
  const grams = document.getElementById(ui+'-grams').value;
  if (!grams || grams <= 0) { alert('请填写正确的克重！'); return; }
  
  const user = ui === 'a' ? 'user_a' : 'user_b';
  await fetch('/api/add_food', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      user, food_name: selected[ui].name,
      grams, kcal_per_100g: selected[ui].kcal_per_100g
    })
  });
  selected[ui] = null;
  document.getElementById(ui+'-grams').value = '';
  document.getElementById(ui+'-results').innerHTML = '';
  document.getElementById(ui+'-search').value = '';
  refresh();
}

// 记录学习
async function addStudy(ui) {
  const minutes = document.getElementById(ui+'-minutes').value;
  if (!minutes || minutes <= 0) return;
  const user = ui === 'a' ? 'user_a' : 'user_b';
  await fetch('/api/study', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ user, minutes })
  });
  document.getElementById(ui+'-minutes').value = '';
  refresh();
}

// 清空数据
async function resetData() {
  if(confirm('确定要清空今天两人的所有数据吗？')) {
    await fetch('/api/reset', {method: 'POST'});
    refresh();
  }
}

// 页面加载时刷新
refresh();
</script>
</body>
</html>
